name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"     # weekly full-history secret scan

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"   # pinned: matches the development machine

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: analyze + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: sqlite for drift tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev
      - run: flutter --version
      - run: flutter pub get
      - name: generated code is committed and current
        run: |
          dart run build_runner build
          flutter gen-l10n
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: format
        run: tool/format.sh --check
      - run: flutter analyze
      - run: flutter test
      - name: hook syntax
        run: sh -n .githooks/pre-commit

  build:
    name: debug apk
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Firebase config (optional; without it the APK has no push)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: delve-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
